<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="{{ google_fonts_url }}" rel="stylesheet"/>
  <style>
    {{ font_face_css | safe }}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px; height: 627px;
      font-family: '{{ body_font }}', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; overflow: hidden; background: #ffffff;
    }
    .side { width: 50%; padding: 78px 68px; display: flex; flex-direction: column; justify-content: center; position: relative; }
    .problem { background: {{ background_color }}; color: white; }
    .solution { background: #f8f9fa; color: {{ dark_text }}; }
    .label {
      font-family: '{{ body_font }}', sans-serif;
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 2.5px; margin-bottom: 22px;
    }
    .problem .label { color: {{ secondary_color }}; }
    .solution .label { color: {{ primary_color }}; }
    .title { 
      font-family: '{{ heading_font }}', sans-serif;
      font-size: 52px; font-weight: 700; line-height: 1.1; margin-bottom: 22px; letter-spacing: -0.01em; 
    }
    .body { 
      font-family: '{{ body_font }}', sans-serif;
      font-size: 22px; line-height: 1.45; opacity: 0.88; 
    }
    .divider { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,0.08); }
    .logo { position: absolute; bottom: 34px; left: 44px; }
    .logo img { width: 92px; height: auto; opacity: 0.72; display: block; }
  </style>
</head>
<body>
  <div class="side problem">
    <div class="label">Problem</div>
    <div class="title">{{ problem_title }}</div>
    <div class="body">{{ problem_body }}</div>
    {% if logo_url %}<div class="logo"><img src="{{ logo_url }}" alt="Logo"/></div>{% endif %}
  </div>
  <div class="side solution">
    <div class="label">Solution</div>
    <div class="title">{{ solution_title }}</div>
    <div class="body">{{ solution_body }}</div>
  </div>
  <div class="divider"></div>
</body>
</html>
