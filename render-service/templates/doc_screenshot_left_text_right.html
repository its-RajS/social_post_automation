<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="{{ google_fonts_url }}" rel="stylesheet"/>
  <style>
    {{ font_face_css | safe }}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px; height: 627px;
      font-family: '{{ body_font }}', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; overflow: hidden; background: #ffffff;
    }
    .left-panel {
      width: 52%; background: #f0f0f0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }
    .left-panel::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, {{ primary_color }}24 0%, {{ secondary_color }}38 100%);
    }
    .screenshot-mockup {
      position: relative; z-index: 1; width: 500px;
      transform: perspective(900px) rotateY(-14deg) rotateX(4deg);
      box-shadow: 0 30px 60px rgba(0,0,0,0.24);
      border-radius: 6px; overflow: hidden; background: white;
    }
    .screenshot-mockup img { width: 100%; height: auto; display: block; }
    .placeholder { width: 500px; height: 330px; background: #FFFFFF; border-radius: 6px; position: relative; z-index: 1; }
    .right-panel {
      width: 48%; padding: 72px 56px;
      display: flex; flex-direction: column; justify-content: center;
      background: #ffffff; position: relative;
    }
    .tag {
      font-family: '{{ body_font }}', sans-serif;
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 2px; color: {{ primary_color }};
      margin-bottom: 20px;
    }
    .title { 
      font-family: '{{ heading_font }}', sans-serif;
      font-size: 48px; font-weight: 700; line-height: 1.15; color: {{ dark_text }}; margin-bottom: 20px; letter-spacing: -0.01em; 
    }
    .subtitle { 
      font-family: '{{ body_font }}', sans-serif;
      font-size: 22px; line-height: 1.45; color: #4a4a4a; margin-bottom: 32px; 
    }
    .cta-button {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; background: #FFFFFF;
      color: {{ primary_color }}; font-size: 14px; font-weight: 600;
      border-radius: 50px; letter-spacing: 0; width: fit-content;
      box-shadow: 0 10px 24px rgba(0,0,0,0.12);
    }
    .cta-button::after { content: ">"; }
    .logo { position: absolute; bottom: 28px; left: 40px; }
    .logo img { width: 90px; height: auto; opacity: 0.7; display: block; }
  </style>
</head>
<body>
  <div class="left-panel">
    {% if screenshot_url %}
      <div class="screenshot-mockup"><img src="{{ screenshot_url }}" alt="Document"/></div>
    {% else %}
      <div class="placeholder"></div>
    {% endif %}
  </div>
  <div class="right-panel">
    <div class="tag">Insight</div>
    <div class="title">{{ title }}</div>
    <div class="subtitle">{{ subtitle }}</div>
    <div class="cta-button">{{ cta | default('Read More') }}</div>
    {% if logo_url %}
    <div class="logo"><img src="{{ logo_url }}" alt="Logo"/></div>
    {% endif %}
  </div>
</body>
</html>
