
services:
  api:
    build: ./nodejs-api
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://user:pass@postgres:5432/linkedin_automation
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=linkedin-automation
      - MINIO_USE_SSL=false
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-whsec_your_webhook_secret_here}
      - VECTOR_DB_PROVIDER=chroma
      - CHROMA_URL=http://chroma:8000
      - KNOWLEDGE_GRAPH_URL=http://knowledge-graph:8002
      - PAGE_ANALYSIS_URL=http://page-analysis:8003
      - CONTENT_SERVICE_URL=http://content-service:8004
      - RENDER_SERVICE_URL=http://render-service:8005
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me-now}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-8}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID:-}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET:-}
      - LINKEDIN_REDIRECT_URI=${LINKEDIN_REDIRECT_URI:-http://localhost:3001/api/v1/linkedin/oauth/callback}
      - LINKEDIN_SCOPES=${LINKEDIN_SCOPES:-openid profile w_member_social}
      - LINKEDIN_API_VERSION=${LINKEDIN_API_VERSION:-202606}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-development-only-change-this-key}
      - MAX_FILE_SIZE=104857600
      - ALLOWED_MIME_TYPES=application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/msword,image/png,image/jpeg,image/webp,image/tiff,text/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  python-worker:
    build: ./python-worker
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/linkedin_automation
      - REDIS_URL=redis://redis:6379
      - QUEUE_NAME=document-processing
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=linkedin-automation
      - WEBHOOK_URL=http://api:3000/api/v1/webhooks/document-processing-complete
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-whsec_your_webhook_secret_here}
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - VECTOR_DB_PROVIDER=chroma
      - CHROMA_URL=http://chroma:8000
      - MAX_WORKERS=2
      - SCREENSHOT_DPI=200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=linkedin_automation
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d linkedin_automation"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data

  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  knowledge-graph:
    build: ./knowledge-graph
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/linkedin_automation
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=gpt-4o
      - WEBHOOK_URL=http://api:3000/api/v1/webhooks/graph-build-complete
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-whsec_your_webhook_secret_here}
      - CHROMA_URL=http://chroma:8000
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  page-analysis:
    build: ./page-analysis
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/linkedin_automation
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=gpt-4o
      - CHROMA_URL=http://chroma:8000
      - GRAPH_SERVICE_URL=http://knowledge-graph:8002
      - WEBHOOK_URL=http://api:3000/api/v1/webhooks/page-analysis-complete
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-whsec_your_webhook_secret_here}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=linkedin-automation
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
      minio:
        condition: service_healthy

  content-service:
    build: ./content-service
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/linkedin_automation
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=gpt-4o
      - KNOWLEDGE_GRAPH_URL=http://knowledge-graph:8002
      - CHROMA_URL=http://chroma:8000
      - POST_FEEDBACK_COLLECTION=post_review_feedback
      - RENDER_SERVICE_URL=http://render-service:8005
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=linkedin-automation
      - WEBHOOK_URL=http://api:3000/api/v1/webhooks/content-generated
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-whsec_your_webhook_secret_here}
      - BRAND_CONFIG_PATH=/app/brand/brand.json
    volumes:
      - ./brand:/app/brand:ro
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started

  render-service:
    build: ./render-service
    ports:
      - "127.0.0.1:8005:8005"
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/linkedin_automation
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=linkedin-automation
      - TEMPLATES_DIR=/app/templates
      - BRAND_CONFIG_PATH=/app/brand/brand.json
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-whsec_your_webhook_secret_here}
    volumes:
      - ./brand:/app/brand:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  postgres_data:
  minio_data:
  chroma_data:
  neo4j_data:
