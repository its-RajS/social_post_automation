<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="{{ google_fonts_url }}" rel="stylesheet"/>
  <style>
    {{ font_face_css | safe }}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px; height: 627px;
      background: #ffffff;
      font-family: '{{ body_font }}', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }
    .panel {
      width: 100%; height: 100%; padding: 78px 92px;
      background: {{ background_color }}; color: white;
      display: flex; flex-direction: column; justify-content: center;
    }
    .date {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 2.5px; color: {{ accent_color }}; margin-bottom: 22px;
    }
    .headline { 
      font-family: '{{ heading_font }}', sans-serif;
      font-size: 72px; font-weight: 700; line-height: 1.1; max-width: 900px; letter-spacing: -0.02em; 
    }
    .body { 
      font-family: '{{ body_font }}', sans-serif;
      font-size: 28px; line-height: 1.4; margin-top: 32px; max-width: 800px; opacity: 0.9; 
    }
    .cta-button {
      display: inline-flex; align-items: center; gap: 10px; width: fit-content;
      margin-top: 40px; padding: 14px 36px; background: #FFFFFF;
      color: {{ primary_color }}; border-radius: 50px; font-size: 15px; font-weight: 600;
      letter-spacing: 0;
    }
    .cta-button::after { content: ">"; }
    .logo { position: absolute; bottom: 38px; left: 54px; }
    .logo img { width: 104px; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="date">{{ date }}</div>
    <div class="headline">{{ headline }}</div>
    <div class="body">{{ body }}</div>
    <div class="cta-button">{{ cta | default('Learn More') }}</div>
  </div>
  {% if logo_url %}<div class="logo"><img src="{{ logo_url }}" alt="Logo"/></div>{% endif %}
</body>
</html>
