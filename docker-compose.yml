version: '3.8'

services:
  api:
    build: ./nodejs-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://user:pass@postgres:5432/linkedin_automation
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=linkedin-automation
      - MINIO_USE_SSL=false
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-whsec_your_webhook_secret_here}
      - VECTOR_DB_PROVIDER=chroma
      - CHROMA_URL=http://chroma:8000
      - MAX_FILE_SIZE=104857600
      - ALLOWED_MIME_TYPES=application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/msword,image/png,image/jpeg,image/webp,image/tiff,text/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  python-worker:
    build: ./python-worker
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/linkedin_automation
      - REDIS_URL=redis://redis:6379
      - QUEUE_NAME=document-processing
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=linkedin-automation
      - WEBHOOK_URL=http://api:3000/api/v1/webhooks/document-processing-complete
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-whsec_your_webhook_secret_here}
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - VECTOR_DB_PROVIDER=chroma
      - CHROMA_URL=http://chroma:8000
      - MAX_WORKERS=2
      - SCREENSHOT_DPI=200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=linkedin_automation
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d linkedin_automation"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data

volumes:
  postgres_data:
  minio_data:
  chroma_data:
