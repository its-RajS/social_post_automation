<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="{{ google_fonts_url }}" rel="stylesheet"/>
  <style>
    {{ font_face_css | safe }}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px; height: 627px;
      background: {{ background_color }};
      font-family: '{{ body_font }}', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column;
      align-items: flex-start; justify-content: center;
      padding: 80px 100px; position: relative; overflow: hidden;
    }
    .accent-bar {
      width: 64px; height: 5px;
      background: {{ primary_color }};
      border-radius: 3px; margin-bottom: 36px;
    }
    .insight-label {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 3px; color: {{ secondary_color }};
      margin-bottom: 20px;
    }
    .insight-text {
      font-family: '{{ heading_font }}', sans-serif;
      font-size: 64px; font-weight: 700; color: #FFFFFF;
      line-height: 1.1; letter-spacing: -0.01em; max-width: 900px;
    }
    .subtitle {
      font-family: '{{ body_font }}', sans-serif;
      font-size: 26px; font-weight: 400;
      color: rgba(255,255,255,0.85);
      margin-top: 28px; max-width: 700px; line-height: 1.45;
    }
    .cta {
      display: inline-flex; align-items: center; gap: 8px; width: fit-content;
      margin-top: 40px; padding: 13px 32px;
      background: #FFFFFF; color: {{ primary_color }};
      border-radius: 50px; font-size: 15px; font-weight: 600;
      letter-spacing: 0;
    }
    .cta::after { content: ">"; }
    .logo { position: absolute; bottom: 40px; left: 60px; }
    .logo img { width: 110px; height: auto; opacity: 0.72; display: block; }
    .bg-circle {
      position: absolute; right: -100px; top: -100px;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, {{ primary_color }}22 0%, transparent 70%);
    }
  </style>
</head>
<body>
  <div class="bg-circle"></div>
  <div class="insight-label">Key Insight</div>
  <div class="accent-bar"></div>
  <div class="insight-text">{{ title }}</div>
  {% if subtitle %}<div class="subtitle">{{ subtitle }}</div>{% endif %}
  {% if cta %}<div class="cta">{{ cta }}</div>{% endif %}
  {% if logo_url %}
  <div class="logo"><img src="{{ logo_url }}" alt="Logo"/></div>
  {% endif %}
</body>
</html>
