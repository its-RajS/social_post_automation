<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="{{ google_fonts_url }}" rel="stylesheet"/>
  <style>
    {{ font_face_css | safe }}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px; height: 627px;
      background: {{ background_color }};
      font-family: '{{ body_font }}', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative; color: #FFFFFF;
    }
    .card { width: 900px; text-align: left; position: relative; }
    .quote-mark {
      font-family: '{{ heading_font }}', sans-serif;
      font-size: 110px; font-weight: 700; line-height: 0.8;
      color: {{ primary_color }}; margin-bottom: 18px; display: block;
    }
    .quote { 
      font-family: '{{ heading_font }}', sans-serif;
      font-size: 52px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; 
    }
    .attribution { 
      font-family: '{{ body_font }}', sans-serif;
      margin-top: 34px; font-size: 24px; color: rgba(255,255,255,0.85); 
    }
    .accent-line { width: 72px; height: 5px; background: {{ primary_color }}; border-radius: 3px; margin-top: 32px; }
    .logo { position: absolute; bottom: 40px; left: 56px; }
    .logo img { width: 108px; height: auto; opacity: 0.72; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <span class="quote-mark">&ldquo;</span>
    <div class="quote">{{ quote }}</div>
    {% if attribution %}<div class="attribution">{{ attribution }}</div>{% endif %}
    <div class="accent-line"></div>
  </div>
  {% if logo_url %}<div class="logo"><img src="{{ logo_url }}" alt="Logo"/></div>{% endif %}
</body>
</html>
